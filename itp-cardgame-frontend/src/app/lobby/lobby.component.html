<!-- main content -->
<div class="flex flex-col items-center justify-center min-h-screen gap-6">
    <h1 class="text-center text-white text-4xl font-bold mt-8 mb-4">
        Lobby of "{{ hostUsername }}" -<br class="block md:hidden" />
        Code: {{ gameId }}
    </h1>
    <div class="flex flex-col md:flex-row items-center justify-center gap-6 md:gap-12">
        <!-- user cards -->
        <div *ngFor="let player of game.players()" class="relative w-64 h-80">
            <app-svg-icon
                class="absolute inset-0 w-full h-full pointer-events-none"
                [src]="'assets/svg/cards/card_background/background.svg'">
            </app-svg-icon>

            <div class="relative z-10 flex flex-col items-center justify-center h-full text-white text-3xl font-bold drop-shadow-md">
                {{ player.nickname }}
            </div>
        </div>

    </div>
    <button hlmBtn class="bg-white font-bold text-lg py-2 px-4 w-34 h-12 mt-4 rounded" (click)="onStartGame()">
        Start game
    </button>
</div>
