<div class="flex min-h-svh w-full items-center justify-center p-6 md:p-10">
    <div class="bg-white flex flex-col items-center justify-center p-6 border border-gray-300 rounded-lg shadow-md min-w-[300px] max-w-[400px] min-h-[250px] max-h-[560px] m-3">
        <section hlmCard>
            <div hlmCardHeader>
                <h3 class="text-3xl text-center" hlmCardTitle>Register</h3>
                <p hlmCardDescription></p>
            </div>
            <div hlmCardContent>
                <!-- Username -->
                <label class="mb-1.5 block text-base " hlmLabel>Username</label>
                <hlm-form-field class="w-full">                        
                    <input class="w-80 p-3 border border-gray-400 rounded-md" hlmInput type="text" placeholder="Username" />
                </hlm-form-field>

                <!-- Email -->
                <label class="block text-base mb-1.5 mt-4" hlmLabel>Email</label>
                <hlm-form-field class="w-full">
                    <input class="w-80 p-3 border border-gray-400 rounded-md" hlmInput type="email" placeholder="Email" />
                </hlm-form-field>
                    
                <!-- Password -->
                <label class="block text-base mb-1.5 mt-4" hlmLabel>Password</label>
                <hlm-form-field class="w-full relative">
                    <input id="password" class="w-80 p-3 pr-10 border border-gray-400 rounded-md" hlmInput type="password" placeholder="Password" />

                    <!-- show password -->
                    <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center justify-center text-gray-500 w-8 h-8"
                            (click)="togglePassword()">
                        <ng-icon [name]="showPassword ? 'lucideEye' : 'lucideEyeClosed'" />
                    </button>
                </hlm-form-field>

                <!-- Confirm Password -->
                <label class="block text-base mb-1.5 mt-4" hlmLabel>Confirm Password</label>
                <hlm-form-field class="w-full">
                    <input class="w-80 p-3 border border-gray-400 rounded-md" hlmInput type="password" placeholder="Password" />
                </hlm-form-field>
            </div>
            <div hlmCardFooter class="flex justify-between items-center mb-2 mt-4">
                <button hlmBtn variant="ghost"><a href="/">Cancel</a></button>
                <button hlmBtn>Create</button>
            </div>
        </section>
    </div>
</div>
