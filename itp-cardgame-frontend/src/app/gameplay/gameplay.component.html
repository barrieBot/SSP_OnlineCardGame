<div class="h-screen overflow-hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 grid-rows-3 items-center justify-between p-2 sm:p-4 gap-2">

    <!-- Player 2: row 2, col 1 -->
    <div class="col-start-1 row-start-2 flex flex-col items-center justify-center p-6 relative">
        <div class="w-full text-center text-white font-bold text-lg sm:text-xl mb-2">Player 2</div>
        <div class="relative h-48 sm:h-64 w-32">
            <div class="absolute top-0 left-0 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white rotate-[90deg] transform">ITP</div>
            <div class="absolute top-6 left-0 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white rotate-[90deg] transform">ITP</div>
            <div class="absolute top-12 left-0 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white rotate-[90deg] transform">ITP</div>
            <div class="absolute top-18 left-0 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white rotate-[90deg] transform">ITP</div>
            <div class="absolute top-24 left-0 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white rotate-[90deg] transform">ITP</div>
            <div class="absolute top-30 left-0 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white rotate-[90deg] transform">ITP</div>
        </div>
    </div>

    <!-- middle: draw Card & place Card -->
    <div class="col-start-2 row-start-2 flex flex-col items-center justify-center p-6">
        <div class="flex items-center justify-center mb-6 space-x-4">
            <!-- draw card stack -->
            <button hlmBtn (click)="drawCard()" class="w-32 sm:w-48 h-48 sm:h-60 rounded-lg shadow flex items-center justify-center text-white text-lg sm:text-3xl cursor-pointer transition-transform hover:scale-105">
                draw card
            </button>

            <!-- middle card -->
            <div class="w-32 sm:w-48 h-48 sm:h-60 relative flex flex-col bg-transparent border-none rounded-lg items-center justify-center">
                <app-svg-icon
                    *ngIf="topCard"
                    class="w-full h-full object-contain"
                    [src]="mapCardToAsset(topCard)">
                </app-svg-icon>
            </div>
        </div>
    </div>

    <!-- Player 3: row 1, col 2 -->
    <div class="col-start-2 row-start-1 flex flex-col items-center justify-center p-6">
        <div class="text-white mb-2 font-bold text-lg sm:text-xl">Player 3</div>
        <div class="relative h-32 w-[140px] sm:w-[160px]">
            <div class="absolute left-0 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white">ITP</div>
            <div class="absolute left-6 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white">ITP</div>
            <div class="absolute left-12 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white">ITP</div>
            <div class="absolute left-18 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white">ITP</div>
            <div class="absolute left-24 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white">ITP</div>
            <div class="absolute left-30 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white">ITP</div>
        </div>
    </div>

    <!-- Player 4: row 2, col 3 -->
    <div class="col-start-3 row-start-2 flex flex-col items-center justify-center p-6 relative">
        <div class="w-full text-center text-white font-bold text-lg sm:text-xl mb-2">Player 4</div>
        <div class="relative h-48 sm:h-64 w-32">
            <div class="absolute top-0 left-0 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white rotate-[270deg] transform">ITP</div>
            <div class="absolute top-6 left-0 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white rotate-[270deg] transform">ITP</div>
            <div class="absolute top-12 left-0 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white rotate-[270deg] transform">ITP</div>
            <div class="absolute top-18 left-0 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white rotate-[270deg] transform">ITP</div>
            <div class="absolute top-24 left-0 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white rotate-[270deg] transform">ITP</div>
            <div class="absolute top-30 left-0 w-24 h-36 bg-blue-400 border-white border-2 rounded shadow flex items-center justify-center text-white rotate-[270deg] transform">ITP</div>
        </div>
    </div>

    <!-- own cards: row 3, col 2 -->
    <div class="col-start-2 row-start-3 relative flex justify-center p-6">
        <div class="relative flex justify-center items-center sm:h-[25vh] w-full max-w-7xl">
            <ng-container *ngFor="let card of playerCards; let i = index">
                <div
                    class="absolute sm:w-56 sm-h-72 md:w-64 md:h-80 transition-transform hover:scale-105 hover:-translate-y-10 cursor-pointer"
                    [ngStyle]="getCardStyle(i, playerCards.length)"
                    (click)="placeCard(i)">
                    <div class="relative inline-block bg-transparent  border-none p-0 m-0 shadow-none">
                        <app-svg-icon
                        class="pointer-events-none"
                        [src]="mapCardToAsset(card)">
                        </app-svg-icon>
                    </div>
                </div>
            </ng-container>
        </div>
    </div>
