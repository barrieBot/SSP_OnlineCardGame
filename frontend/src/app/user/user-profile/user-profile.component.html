<div class="min-h-[95vh] w-full bg-slate-50 rounded-2xl mx-auto p-6">

    <!-- header -->
    <header class="bg-slate-50 text-black p-6">
        <div class="container mx-auto flex items-center justify-between">

            <!-- left: profile + settings -->
            <div class="flex items-center space-x-4">
                <button hlmBtn variant="link" type="button" class="text-lg cursor-pointer" routerLink="/profile">Profile</button>
                <button hlmBtn variant="link" type="button" class="text-lg cursor-pointer" routerLink="/settings">Settings</button>
            </div>

            <!-- right: create lobby + join lobby -->
            <div class="flex items-center gap-2">
                <hlm-dialog>
                    <button brnDialogTrigger hlmBtn variant="outline" class="text-black border-green-600 hover:bg-green-100">Join lobby</button>

                    <hlm-dialog-content class="sm:max-w-[425px]" *brnDialogContent="let ctx">
                        <hlm-dialog-header>
                            <h3 hlmDialogTitle>Enter Passcode</h3>
                            <p hlmDialogDescription>Only registered players can join lobbies.</p>
                        </hlm-dialog-header>

                        <div class="flex items-center w-full space-x-2 mt-4">
                            <input hlmInput
                                   [(ngModel)]="lobbyCode"
                                   placeholder="Code"
                                   class="flex-1" />
                            <button hlmBtn (click)="joinLobby()">Enter</button>
                        </div>
                    </hlm-dialog-content>
                </hlm-dialog>

                <button hlmBtn variant="default" class="text-white bg-green-600 hover:bg-green-700" (click)="createMatch()">Create lobby</button>
            </div>
        </div>
    </header>

    <!-- banner -->
    <div class="bg-linear-to-r from-rose-400 to-orange-300 relative h-60 rounded-xl overflow-hidden">
        <div class="absolute inset-0 bg-black opacity-30 z-0"></div>
    </div>

    <!-- profile picture -->
    <div class="relative z-10 flex flex-col items-center -mt-20">
        <img class="w-40 h-40 rounded-full border-4 border-white shadow-lg bg-slate-100">
        <p class="text-2xl font-semibold text-black mt-2">{{ user?.username || 'Unknown user' }}</p>
        <brn-separator hlmSeparator class="mt-6 w-full max-w-5xl"/>
    </div>

    <!-- main Content -->
    <div class="mt-10 w-full max-w-5xl mx-auto flex flex-col gap-8 items-center">
    
        <!-- overview -->
        <div class="w-full flex justify-center mt-0">
            <div class="w-full">
                <h2 class="text-2xl font-semibold text-black text-left mb-0">Overview</h2>
            </div>
        </div>
        <div class="flex flex-wrap justify-center gap-4">
