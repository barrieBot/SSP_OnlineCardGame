<div class="min-h-[95vh] w-full bg-slate-50 rounded-2xl mx-auto p-6">

    <!-- header -->
    <header class="bg-slate-50 text-black p-6">
        <div class="container mx-auto flex items-center justify-start space-x-4 -ml-4">
            <div class="flex items-center space-x-4">
                <button hlmBtn variant="link" type="button" class="text-lg cursor-pointer" routerLink="/profile">Profile</button>
                <button hlmBtn variant="link" type="button" class="text-lg cursor-pointer" routerLink="/settings">Settings</button>
            </div>
        </div>
    </header>

    <!-- main Content -->
    <div class="mt-10 w-full max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
        <div class="md:col-span-2">
            <p class="text-2xl font-medium">Account settings</p>
            <p class="text-gray-500">Here you can change your account information</p>
        </div>

        <!-- username -->
        <div>
            <label hlmLabel class="block text-base mb-2">Username</label>
            <hlm-form-field>
                <input hlmInput type="text" [(ngModel)]="newUsername" placeholder="New username" class="w-80 p-3 border rounded-md" />
            </hlm-form-field>
        </div>

        <!-- email -->
        <div>
            <label class="block text-base mb-2" hlmLabel>EMail</label>
            <hlm-form-field>
                <input hlmInput type="email" [(ngModel)]="newEmail" placeholder="New email address" class="w-80 p-3 border rounded-md" />
            </hlm-form-field>
        </div>

        <div class="md:col-span-2">
            <button hlmBtn type="button" (click)="saveChanges()">Save changes</button>
        </div>
    </div>
</div>
