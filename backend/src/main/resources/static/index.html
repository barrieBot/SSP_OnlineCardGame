<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WS-Game-Test-Frontend</title>
</head>
<body>

<div style="display: flex; flex-direction: column; width: 200px; gap: 10px">
    Username:
    <input type="text" id="usernameInput" placeholder="Username...">
    Email:
    <input type="text" id="emailInput" placeholder="Email...">
    Password:
    <input type="password" id="passwordInput" placeholder="Password...">
    Jwt:
    <input type="text" id="jwtInput" placeholder="Jwt...">
    Game Code:
    <input type="text" id="gameCodeInput" placeholder="Game Code...">
    Card Name:
    <input type="text" id="cardNameInput" placeholder="Card Name...">
    Card Value
    <input type="text" id="cardValueInput" placeholder="Card Value...">
    Card Event
    <input type="text" id="cardEventInput" placeholder="Card Event...">

    <button type="submit" id="registerButton">Register</button>
    <button type="submit" id="loginButton">Login</button>
    <button type="submit" id="connectWSButton">Connect WS</button>
    <button type="submit" id="but_new_game">New Game</button>
    <button type="submit" id="but_join_game">Join Game</button>
    <button type="submit" id="but_join_game_anonymous">Join Game Anonymous</button>
    <button type="submit" id="startGameButton">Start Game</button>
    <button type="submit" id="playCardButton">Play Card</button>
    <button type="submit" id="drawCardButton">Draw Card</button>
    <button type="submit" id="closeGameButton">Close Game</button>
    <button type="submit" id="restartGameButton">Restart Game</button>
    <button type="submit" id="reconnectButton">Reconnect WebSocket</button>
</div>
